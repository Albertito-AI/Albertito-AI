name: Publish IBOL MCP bundle

on:
  push:
    branches: [main]
    paths: ['mcp/ibol/release-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibol-mcp-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Albertito-AI/Albertito-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned build tools
        run: |
          python -m pip install uv==0.13.5
          npm install --prefix "$RUNNER_TEMP/mcpb-tool" --ignore-scripts @anthropic-ai/mcpb@2.1.2
      - name: Test and build exact reviewed inputs
        run: |
          uv sync --frozen --project mcp/ibol
          uv run --frozen --project mcp/ibol python -m unittest discover -s scripts/ibol -p 'test_*.py' -v
          python scripts/ibol/package_mcpb.py --output "$RUNNER_TEMP/ibol-dist"
          "$RUNNER_TEMP/mcpb-tool/node_modules/.bin/mcpb" validate mcp/ibol/manifest.json
      - name: Exercise the extracted bundle using its frozen runtime
        run: |
          python -m zipfile -e "$(find "$RUNNER_TEMP/ibol-dist" -maxdepth 1 -name 'ibol-open-learning-*.mcpb' -print -quit)" "$RUNNER_TEMP/ibol-extracted"
          uv run --frozen --directory "$RUNNER_TEMP/ibol-extracted" scripts/cli.py metadata
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ibol-release-inputs
          path: ${{ runner.temp }}/ibol-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.repository == 'Albertito-AI/Albertito-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ibol-release-inputs
          path: ${{ runner.temp }}/ibol-dist
      - name: Verify pinned official registry publisher
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz' --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          printf '%s  %s\n' '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4' "$RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate "$RUNNER_TEMP/ibol-dist/server.json"
      - name: Publish or resume the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ibol/publish_mcpb_release.py --dist "$RUNNER_TEMP/ibol-dist"
      - name: Publish metadata to the official MCP Registry and read it back
        run: |
          set +e
          python scripts/ibol/check_registry.py "$RUNNER_TEMP/ibol-dist/server.json" > "$RUNNER_TEMP/registry-receipt.json"
          registry_status=$?
          set -e
          if [ "$registry_status" -eq 2 ]; then
            "$RUNNER_TEMP/mcp-publisher" login github-oidc --registry https://registry.modelcontextprotocol.io
            "$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/ibol-dist/server.json"
            python scripts/ibol/check_registry.py "$RUNNER_TEMP/ibol-dist/server.json" > "$RUNNER_TEMP/registry-receipt.json"
          elif [ "$registry_status" -ne 0 ]; then
            exit "$registry_status"
          fi
          cat "$RUNNER_TEMP/registry-receipt.json"
      - name: Clear temporary registry credentials
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/mcp-publisher" ]; then
            "$RUNNER_TEMP/mcp-publisher" logout
          fi
