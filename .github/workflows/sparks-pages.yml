name: Publish Sparks Dance Floor

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/sparks-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparks-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only the Dance Floor
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the published HTML matches this commit
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen
          expected = hashlib.sha256(Path("site/index.html").read_bytes()).hexdigest()
          url = os.environ["PAGES_URL"]
          assert url == "https://albertito-ai.github.io/Albertito-AI/", url
          for attempt in range(6):
              try:
                  request = Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Sparks-Pages-Verification"})
                  with urlopen(request, timeout=20) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  if actual == expected:
                      print("Verified published HTML:", url, expected)
                      break
              except Exception as error:
                  print("Delivery check:", type(error).__name__, str(error)[:200])
              if attempt == 5:
                  raise SystemExit("Published HTML did not match the committed source")
              time.sleep(5)
          PY
