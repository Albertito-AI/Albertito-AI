name: Publish Research Lab

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/lab/**'
      - '.github/workflows/sparks-pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact data-update commit to publish after a scheduled refresh.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: sparks-pages
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ARTIFACT: research-lab-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check the site has a recorded execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("site/lab")
          for name in ["index.html", "app.js", "styles.css", "data/catalog.json", "data/regnav.json"]:
              assert (root / name).is_file(), name
          record = json.loads((root / "data/regnav.json").read_text())
          assert record["receipts"], "No executed examples recorded"
          assert record["scenarios"], "No interactive scenarios recorded"
          assert record["provenance"]["sources"], "No pinned source revisions"
          print("Recorded research lab files are present.")
          PY
      - name: Validate the growing library
        run: python scripts/library/refresh.py --check
      - name: Avoid publishing an outdated revision
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD:site)" != "$(git rev-parse FETCH_HEAD:site)" ]; then
            echo '::error::The site changed on main before publication. Its newer site deployment must publish the combined state.'
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the Research Lab
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: site
          include-hidden-files: true
      - name: Wait for the uploaded Pages artefact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Upload returned no artefact ID"; exit 1; }
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            if visible=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f name="$PAGES_ARTIFACT" --jq '.artifacts[] | select(.expired == false) | .id') \
                && [[ "$visible" == "$ARTIFACT_ID" ]]; then
              exit 0
            fi
          done
          echo "::error::GitHub did not list the expected Pages artefact ($PAGES_ARTIFACT, ID $ARTIFACT_ID)"
          exit 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
      - name: Verify delivery of every site file
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -u scripts/lab/verify_delivery.py --url "$PAGES_URL"
      - name: Install live browser verification
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Verify the published research journey
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -u scripts/lab/check_browser.py --url "${PAGES_URL}lab/"
      - name: Verify the published entry and fallback routes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -u scripts/check_sparks_browser.py --url "$PAGES_URL"
