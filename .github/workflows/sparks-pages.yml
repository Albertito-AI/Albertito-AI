name: Publish research lab and Sparks Dance Floor

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/lab/**'
      - '.github/workflows/sparks-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparks-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check the site has a recorded execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("site/lab")
          for name in ["index.html", "app.js", "styles.css", "data/catalog.json", "data/regnav.json", "assets/sparks.png"]:
              assert (root / name).is_file(), name
          record = json.loads((root / "data/regnav.json").read_text())
          assert record["receipts"], "No executed examples recorded"
          assert record["scenarios"], "No interactive scenarios recorded"
          assert record["provenance"]["sources"], "No pinned source revisions"
          print("Recorded research lab files are present.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the research lab and Dance Floor
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify delivery of every site file
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -u scripts/lab/verify_delivery.py --url "$PAGES_URL"
      - name: Install live browser verification
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Verify the published research journey
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -u scripts/lab/check_browser.py --url "${PAGES_URL}lab/"
