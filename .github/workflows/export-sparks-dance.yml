name: Archived Sparks media checks

# Historical media remains inspectable. It has no scheduled or push-triggered upkeep.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install archive verification dependencies
        run: |
          python -m pip install playwright==1.64.1 Pillow==13.0.0
          python -m playwright install --with-deps chromium
      - name: Verify the preserved dance source and media locally
        run: python -u scripts/check_sparks_media.py
