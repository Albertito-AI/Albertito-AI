name: Publish research resource agent MCP metadata

on:
  push:
    branches: [main]
    paths: ['mcp/research-resource-agent/release-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-resource-agent-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Albertito-AI/Albertito-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the pinned environment manager
        run: python -m pip install uv==0.13.5
      - name: Check reviewed metadata and immutable-publication guards
        run: |
          uv sync --frozen --project mcp/research-resource-agent
          python scripts/research_resource/check_registry.py --metadata-only
          uv run --frozen --project mcp/research-resource-agent python -m unittest discover -s scripts/research_resource -p 'test_*.py' -v
      - name: Verify pinned official Registry publisher and schema
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz' --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          printf '%s  %s\n' '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4' "$RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate mcp/research-resource-agent/server.json
      - name: Verify the public deployment and both MCP protocol versions
        run: |
          uv run --frozen --project mcp/research-resource-agent python scripts/research_resource/check_remote.py --output "$RUNNER_TEMP/research-resource-live-check.json"
      - name: Publish only an absent exact version, then read it back
        run: |
          set +e
          python scripts/research_resource/check_registry.py > "$RUNNER_TEMP/research-resource-registry-receipt.json"
          registry_status=$?
          set -e
          if [ "$registry_status" -eq 2 ]; then
            "$RUNNER_TEMP/mcp-publisher" login github-oidc --registry https://registry.modelcontextprotocol.io
            "$RUNNER_TEMP/mcp-publisher" publish mcp/research-resource-agent/server.json
            python scripts/research_resource/check_registry.py > "$RUNNER_TEMP/research-resource-registry-receipt.json"
          elif [ "$registry_status" -ne 0 ]; then
            exit "$registry_status"
          fi
          cat "$RUNNER_TEMP/research-resource-registry-receipt.json"
      - name: Clear temporary Registry credentials
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/mcp-publisher" ]; then
            "$RUNNER_TEMP/mcp-publisher" logout
          fi
      - name: Preserve public verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-resource-registry-receipts
          path: |
            ${{ runner.temp }}/research-resource-live-check.json
            ${{ runner.temp }}/research-resource-registry-receipt.json
          if-no-files-found: ignore
          retention-days: 7
