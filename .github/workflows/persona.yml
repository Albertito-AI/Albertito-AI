name: Public project source observations

on:
  schedule:
    # One daily source check at 07:17 Asia/Singapore (UTC+08:00).
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      refresh_workbench:
        description: 'Check the public project sources again today'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'scripts/sparks_agent.py'
      - 'data/sparks-catalog.json'
      - '.github/workflows/persona.yml'

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'Albertito-AI/Albertito-AI' && github.ref == 'refs/heads/main'
    concurrency:
      # Preserve the existing lock while retiring the former companion writer.
      group: albertito-companion-state
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test public-source observation and evidence preservation
        run: python -m unittest discover -s tests -p 'test_sparks_agent.py' -v
      - name: Observe public project sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_WORKBENCH: ${{ github.event_name == 'push' || inputs.refresh_workbench }}
        run: |
          if [ "$REFRESH_WORKBENCH" = 'true' ]; then
            python scripts/sparks_agent.py observe --event-id "actions:$GITHUB_RUN_ID" --force
          else
            python scripts/sparks_agent.py observe --event-id "actions:$GITHUB_RUN_ID"
          fi
      - name: Check source observations and profile integrity
        run: |
          python scripts/sparks_agent.py --check
          python scripts/validate_profile.py
      - name: Save public-source observations
        run: |
          set -euo pipefail
          git add -- data/sparks-knowledge.json docs/SPARKS_WORKBENCH.md
          if git diff --cached --quiet; then
            echo 'Public project observations are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public project source observations'
          # A normal push rejects concurrent main changes. Never overwrite them.
          git push origin HEAD:main
