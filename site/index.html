<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Albert Tan's Research Lab: recorded examples, research tools and traceable sources.">
  <title>Research Lab · Albert Tan</title>
  <link rel="canonical" href="https://albertito-ai.github.io/Albertito-AI/lab/">
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#271e2c;background:#fffdf9}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:650px;line-height:1.7}
    .eyebrow{color:#934609;font-size:.75rem;font-weight:700;letter-spacing:.14em}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,7vw,3.5rem);line-height:1.1;font-weight:500;margin:16px 0}
    p{color:#625969}a{color:#713306;text-underline-offset:4px}
    .button{display:inline-block;padding:12px 18px;border-radius:7px;background:#211627;color:#fffdf9;text-decoration:none;font-weight:650}
    a:focus-visible{outline:3px solid #ca710d;outline-offset:4px}
    nav{display:flex;flex-wrap:wrap;gap:20px;margin-top:25px;font-size:.9rem}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ALBERT TAN · LAW · EVIDENCE · TECHNOLOGY</p>
    <h1>Research you can inspect and reproduce.</h1>
    <p>Explore recorded examples, research tools and source-linked resources in the Research Lab.</p>
    <p><a id="lab-entry" class="button" href="lab/">Open the Research Lab</a></p>
    <nav aria-label="Related work"><a href="https://github.com/Albertito-AI/Albertito-AI">GitHub profile</a><a href="https://www.alberttansinhon.com/">Website</a><a href="https://www.alberttansinhon.com/listen-and-learn/">Listen &amp; Learn</a></nav>
  </main>
  <script>
    (function () {
      "use strict";
      var current = new URL(window.location.href);
      var target = new URL("lab/", current);
      ["scenario", "record"].forEach(function (key) {
        var value = current.searchParams.get(key);
        if (value !== null && value.length <= 200) target.searchParams.set(key, value);
      });
      var anchors = ["#main", "#replay", "#guide", "#library", "#projects", "#research", "#teaching", "#references", "#watch-listen", "#verification"];
      if (anchors.includes(current.hash)) target.hash = current.hash;
      document.getElementById("lab-entry").href = target.href;
      window.location.replace(target.href);
    }());
  </script>
</body>
</html>
